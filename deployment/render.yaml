services:
  - type: web
    name: ai-sales-backend
    env: docker
    dockerContext: ./backend
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-sales-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-sales-redis
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
  - type: web
    name: ai-sales-frontend
    env: docker
    dockerContext: ./frontend
    healthCheckPath: /api/health
databases:
  - name: ai-sales-postgres
    databaseName: sales_ai
    user: sales_ai
  - name: ai-sales-redis
    plan: free
