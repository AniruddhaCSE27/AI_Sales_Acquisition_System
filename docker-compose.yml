services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sales_ai
      POSTGRES_PASSWORD: sales_ai
      POSTGRES_DB: sales_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_ai -d sales_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./ai_models:/app/ai_models

  celery_worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO --queues=ai,reports,mlops,notifications
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./ai_models:/app/ai_models
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery_app inspect ping --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery_beat:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c 'from app.workers.celery_app import celery_app; print(celery_app.main)' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env.example
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  streamlit:
    build:
      context: .
      dockerfile: streamlit_app/Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql+psycopg://sales_ai:sales_ai@postgres:5432/sales_ai
      REDIS_URL: redis://redis:6379/0
      MODEL_REGISTRY_DIR: /workspace/ai_models/registry
      VECTOR_DB_DIR: /workspace/ai_models/vector_db
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    volumes:
      - ./ai_models:/workspace/ai_models
      - ./logs:/workspace/logs
      - ./reports:/workspace/reports

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
